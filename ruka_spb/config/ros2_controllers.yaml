controller_manager:
  ros__parameters:
    update_rate: 100

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    ruka_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    ruka_hand_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    ruka_gripper_effort_controller:
      type: forward_command_controller/ForwardCommandController

ruka_arm_controller:
  ros__parameters:
    joints:
      - joint_1
      - joint_2
      - joint_3
      - joint_4
      - joint_5
      - joint_6
    command_interfaces:
      - position
      - velocity
    state_interfaces:
      - position
      - velocity
    set_last_command_interface_value_as_state_on_activation: false
    allow_nonzero_velocity_at_trajectory_end: true

ruka_hand_controller:
  ros__parameters:
    joints:
      - link_hand_cyl__first_fin
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    constraints:
      # The path tolerance covers the complete 0.017 m finger stroke, while
      # the goal tolerance still requires the final measured position.
      goal_time: 3.0
      stopped_velocity_tolerance: 0.0005
      link_hand_cyl__first_fin:
        trajectory: 0.018
        goal: 0.001

ruka_gripper_effort_controller:
  ros__parameters:
    joints:
      - link_hand_cyl__first_fin
    interface_name: effort

# Planning velocity limits are 16/9 of the initial conservative values. With an
# RViz scaling factor of 0.1 this gives about 0.0178 rad/s. Real commands remain
# capped at 0.1 rad/s by the unchanged hardware interface.
default_velocity_scaling_factor: 1.0
default_acceleration_scaling_factor: 0.1

joint_limits:
  joint_1:
    has_velocity_limits: true
    max_velocity: 0.177778

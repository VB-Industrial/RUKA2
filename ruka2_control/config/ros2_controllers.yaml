controller_manager:
  ros__parameters:
    # Цикл чтения, обновления и записи ros2_control.
    update_rate: 100

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    ruka_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    mechanical_gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController

ruka_arm_controller:
  ros__parameters:
    joints:
      - joint_1
      - joint_2
      - joint_3
      - joint_4
      - joint_5
      - joint_6
    command_interfaces:
      - position
      - velocity
    state_interfaces:
      - position
      - velocity
    action_monitor_rate: 100.0
    interpolation_method: splines
    allow_partial_joints_goal: false
    allow_nonzero_velocity_at_trajectory_end: false

mechanical_gripper_controller:
  ros__parameters:
    joints:
      - link_hand_cyl__first_fin
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    action_monitor_rate: 100.0
    interpolation_method: splines
    allow_partial_joints_goal: false
    allow_nonzero_velocity_at_trajectory_end: false
